<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart BPM 3D Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.35);
      z-index: 10;
      min-width: 280px;
    }

    .row {
      margin: 6px 0;
      font-size: 14px;
    }

    .label {
      color: #94a3b8;
      margin-right: 6px;
    }

    .value {
      color: #f8fafc;
      font-weight: 700;
    }

    #chartWrap {
      margin-top: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 8px;
      background: rgba(2, 6, 23, 0.7);
    }

    #chartTitle {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 6px 0;
    }

    #signalChart {
      display: block;
      width: 100%;
      height: 120px;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 6px;
    }

    #resetView {
      margin-top: 8px;
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="overlay">
      <div class="row"><span class="label">BPM:</span><span id="bpm" class="value">--</span></div>
      <div class="row"><span class="label">Status:</span><span id="status" class="value">Loading...</span></div>
      <div class="row"><span class="label">Model:</span><span id="model" class="value">realistic-human-heart/source/Heart.fbx</span></div>
      <button id="resetView" type="button">Reset View (Zoom Out)</button>
      <div id="chartWrap">
        <p id="chartTitle">Signal Preview (with detected peaks)</p>
        <canvas id="signalChart" width="280" height="120"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
